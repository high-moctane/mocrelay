version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: thursday
      timezone: Asia/Tokyo
    # Merged PRs are tagged and published without a human look, so give the
    # community a week to catch a compromised release first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "go"
      - dependency-name: "toolchain"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
